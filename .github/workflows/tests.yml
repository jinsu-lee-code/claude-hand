name: tests

on:
  push:
  pull_request:

jobs:
  python:
    # The Python tests need nothing installed: no uv, Unity, Blender or Claude Code. Tests that need Blender's bpy
    # skip themselves here; `claude_hand.py selftest` runs those inside a real Blender on a PC that has one.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]  # the oldest the scripts promise (requires-python), and a current one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        # The same tests as `python -m unittest discover -s tools/tests`; a failure also becomes an annotation on the
        # run's summary page, which can be read without signing in (a job's log cannot).
        run: python tools/tests/ci.py
      - name: Every script still parses on this Python
        run: python -m compileall -q tools blender
